<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00695C" />
      <stop offset="100%" stop-color="#26A69A" />
    </linearGradient>
    <radialGradient id="ring7" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00695C" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Octagon Badge Body -->
  <g filter="url(#shadow7)">
    <path d="M 80 14 L 126 34 L 146 80 L 126 126 L 80 146 L 34 126 L 14 80 L 34 34 Z" 
          fill="url(#grad7)" 
          stroke="#FAF7F4" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>
    <path d="M 80 14 L 126 34 L 146 80 L 126 126 L 80 146 L 34 126 L 14 80 L 34 34 Z" 
          fill="url(#ring7)"/>
  </g>

  <!-- Inner Circle Frame -->
  <circle cx="80" cy="80" r="46" fill="#1A1714" stroke="#FAF7F4" stroke-width="2.5" opacity="0.92" />
  <circle cx="80" cy="80" r="41" fill="none" stroke="#26A69A" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Center Symbol Icon (24x24 viewBox mapped to center) -->
  <g transform="translate(62, 62) scale(1.5)" color="#26A69A">
    <polyline points="16 18 22 12 16 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="8 6 2 12 8 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>